services:
  postgres:
    image: postgres:16
    container_name: orqestra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orqestra
      POSTGRES_USER: orqestra
      POSTGRES_PASSWORD: orqestra
    ports:
      - "5433:5432"
    volumes:
      - orqestra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orqestra -d orqestra"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  orqestra-pgdata:
